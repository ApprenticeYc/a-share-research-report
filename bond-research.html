.public-nav{display:flex;justify-content:space-between;gap:12px;align-items:center}.public-nav a{color:#175cd3}.source-link{word-break:break-all}.plain-list{padding-left:20px}.small{font-size:12px}.hidden{display:none}</style></head><body><main class="wrap"><div class="public-nav"><h1>债券基金研究看板 · 含偏债混合</h1><a href="index.html">返回研究首页</a></div><div id="subtitle" class="muted"></div><div class="notice">截至所示日期的公开研究快照。可查询已收录资料；补采由研究端更新；本页不是实时任务入口。历史收益和回撤只描述已发生的关系，不构成推荐、预测或交易指令。</div><section id="stats" class="stats"></section><section id="coverage-detail" class="notice"></section><h2>纯债 · 四种研究方向</h2><section id="styles" class="styles"></section><h2>查询与比较</h2><section class="searchbox"><label for="query">可一次粘贴多个 6 位基金代码或基金名称（空格、逗号或换行分隔）</label><div class="searchrow"><textarea id="query" placeholder="例如：018603&#10;基金名称"></textarea><button id="search">查询</button></div><div id="results" class="results muted">查询本次已收录资料；页面不会联网补采。</div></section><h2>已收录研究档案与来源</h2><section id="dossiers"></section><details><summary>方法与限制</summary><div id="method" class="muted">净值窗口为 1、3、6、12、24 个月；缺失窗口不补零。纯债与偏债混合独立呈现。偏债混合的实际权益仓位是报告期末观测，不是总风险等级；转债、融资和利率敏感性另行展示。没有可靠的同日同窗指数序列时，基准状态为未知，页面不会混用不同报告期数据计算 alpha。</div></details></main><script>const DATA={"asset_base": "bond-data/bond_v3_20260923T004435752662"};
const e=(tag,txt,cls)=>{const x=document.createElement(tag);if(txt!==undefined)x.textContent=txt;if(cls)x.className=cls;return x};
const val=v=>v===null||v===undefined||v===''?'数据不足':String(v);const pct=v=>v===null||v===undefined||v===''||Number.isNaN(Number(v))?'数据不足':(Number(v)*100).toFixed(2)+'%';
const safeHref=v=>{try{const u=new URL(String(v||''));return ['http:','https:'].includes(u.protocol)?u.href:'#'}catch(_){return '#'}};
const STYLE_ORDER=['low_drawdown','balanced','enhanced','liquid'];const STYLE_LABELS={low_drawdown:'低回撤',balanced:'均衡',enhanced:'增强',liquid:'流动性优先'};const STATUS={verified:'已核验',partial:'部分证据待核',missing:'尚无研究档案',passed:'已通过',unknown:'未知',estimated:'标准费率情景',ok:'数据可用',insufficient:'数据不足'};const PEER_LABELS={debt_mixed:'偏债混合',short_pure_bond:'中短债',medium_pure_bond:'中长债',long_pure_bond:'中长债',interest_rate_bond:'利率债',credit_bond:'信用债',primary_bond:'一级混合债',secondary_bond:'二级混合债',convertible_bond:'转债策略',unclassified_bond:'类别待核',overseas_risk:'跨境策略'};const STRATEGY_LABELS={pure_bond:'纯债',debt_mixed:'偏债混合',primary_bond:'一级债基',secondary_bond:'二级债基',convertible_bond:'可转债策略'};const peerText=x=>PEER_LABELS[x]||'类别待核';const strategyText=x=>STRATEGY_LABELS[x]||'策略待核';const byCode=new Map((DATA.funds||[]).map(f=>[String(f.share_id||''),f]));
const reasonMap={evidence_status_not_verified:'资料尚未完成核验',identity_verified_required:'基金身份待核',report_verified_required:'定期报告待核',terms_verified_required:'申赎条款待核',risk_verified_required:'风险资料待核',dossier_style_unsuitable:'档案显示与该风格不适配',five_window_history_insufficient_new_or_partial_observation:'共同五窗口历史不足',independent_review_not_passed:'独立复核尚未通过',actual_equity_exposure_missing:'报告期末权益暴露待核',risk_report_period_missing:'风险报告期待核',convertible_bond_exposure_missing:'转债敞口待核',leverage_exposure_missing:'融资敞口待核',interest_rate_sensitivity_missing:'利率敏感性待核',minimum_holding_days_not_verified:'最低持有期尚未核验',minimum_holding_days_not_verified_zero:'最低持有期尚未确认可随时提出赎回',settlement_note_not_substantive:'赎回到账规则待核',recent_24m_rolling_loss_ratio_24m_insufficient:'近两年24个月滚动亏损样本不足',recent_24m_rolling_sample_24m_not_full_coverage:'近两年24个月滚动样本未完整覆盖',return_window_insufficient:'收益窗口不足',drawdown_window_insufficient:'回撤窗口不足'};const reasonText=x=>reasonMap[x]||'其他资料或可比性待补齐';
function windowTable(f){const table=e('table',undefined,'metric-table'),head=e('tr');['窗口','实际起止','收益','同窗最大回撤','近两年共同滚动样本'].forEach(x=>head.append(e('th',x)));table.append(head);for(const n of [1,3,6,12,24]){const w=(f.metrics||{}).windows?.[n]||{},r=(f.metrics||{}).recent_24m_rolling_windows?.[n]||{},tr=e('tr');[n+'个月',[w.actual_start,w.actual_end].filter(Boolean).join(' 至 ')||'数据不足',pct(w.return),pct(w.drawdown?.max_drawdown_magnitude),r.count===undefined?'数据不足':String(r.count)+' 个窗口；亏损 '+pct(r.loss_ratio)+'；'+(r.sample_covers_endpoint_start===true?'完整覆盖':r.sample_covers_endpoint_start===false?'覆盖不足':'完整性待核')].forEach(x=>tr.append(e('td',x)));table.append(tr)}const more=e('details');more.append(e('summary','查看五期限近两年共同滚动统计'));const d=e('div');for(const n of [1,3,6,12,24]){const r=(f.metrics||{}).recent_24m_rolling_windows?.[n]||{};d.append(e('p',n+'月：均值 '+pct(r.mean_return)+'；最差 '+pct(r.worst_return)+'；P05 '+pct(r.p05_return)+'；亏损 '+pct(r.loss_ratio)+'；'+val(r.count)+' 个窗口；'+(r.sample_covers_endpoint_start===true?'完整覆盖':r.sample_covers_endpoint_start===false?'覆盖不足，不能用于正式共同排名':'完整性待核')))}more.append(d);const out=e('div');out.append(table,more);return out}
function evidenceBlock(f){const ev=f.evidence||{},box=e('div',undefined,'evidence');box.append(e('b','资料状态：'+(STATUS[ev.status]||'待核')));if(ev.independent_review?.status==='passed')box.append(e('p','已通过独立复核；审签与冻结档案 SHA 绑定。审签仅覆盖档案事实与费用原文的独立核对，不等于完整金融风险审查；partial 状态和风险缺口仍保留。','muted'));if(ev.report_period)box.append(e('p','组合事实报告期：'+ev.report_period+'。','muted'));const risk=ev.risk||{};for(const [key,label] of [['equity_exposure','权益暴露'],['duration','久期与利率'],['interest_rate_sensitivity','利率敏感性'],['leverage','融资'],['credit_concentration','信用与集中度']]){const r=risk[key];if(r)box.append(e('p',label+'：'+[r.assessment,r.evidence].filter(Boolean).join('；')))}if(ev.research_conclusion)box.append(e('p','研究结论：'+ev.research_conclusion));if(ev.return_sources?.length){const ul=e('ul',undefined,'plain-list');ev.return_sources.forEach(x=>ul.append(e('li','收益来源：'+x)));box.append(ul)}if(ev.findings?.length){const ul=e('ul',undefined,'plain-list');ev.findings.forEach(x=>ul.append(e('li',x.statement+(x.pdf_page?'（第 '+x.pdf_page+' 页）':''))));box.append(ul)}const fees=ev.fees||{};if(Object.keys(fees).length)box.append(e('p','费用：申购 '+val(fees.subscription)+'；管理费 '+val(fees.annual_management_pct)+'%；托管费 '+val(fees.annual_custody_pct)+'%；销售服务费 '+val(fees.annual_sales_service_pct)+'%。'));if(ev.unknowns?.length)box.append(e('p','尚未闭合：'+ev.unknowns.join('；'),'warn'));if(ev.source_documents?.length){const ul=e('ul',undefined,'plain-list');ev.source_documents.forEach(d=>{const li=e('li'),a=e('a',d.title||'公开披露','source-link');a.href=safeHref(d.source_url);a.target='_blank';a.rel='noopener';li.append(a,document.createTextNode(' · 披露日 '+val(d.published_at)+' · SHA '+val(d.sha256)+' · '+val(d.page_count)+' 页'));ul.append(li)});box.append(ul)}return box}
const NAV_STATES={available:'原始净值已取得并完成一致性校验',not_collected:'尚未采集，已列补采队列',acquisition_failed:'抓取失败，保留失败记录待重试',integrity_or_calculation_failed:'来源或计算校验失败，不用于排名',behind_known_observation:'落后于已知净值日期，待补采'};
function qualityBlock(f){const q=f.data_completeness||{},box=e('div',undefined,'notice');if(!Object.keys(q).length)return box;box.append(e('p','净值：'+(NAV_STATES[q.nav_state]||'状态待核')));if(q.insufficient_windows_months?.length&&f.metrics)box.append(e('p','观察历史不能覆盖 '+q.insufficient_windows_months.join('、')+' 个月窗口；这不等于确认基金成立时间，也不补造历史。'));const labels={report:'定期报告',key_information:'本份额资料概要',prospectus:'招募说明书'};if(q.missing_document_kinds?.length)box.append(e('p','待补文件：'+q.missing_document_kinds.map(x=>labels[x]||'其他文件').join('、')));box.append(e('p','研究：'+({verified:'证据已核验',partial_review:'已研究，仍有明确风险缺口',not_researched:'尚未完成报告深研；已下载文件不代表已审查'}[q.research_state]||'待核')));if(q.rank_comparison_review_months?.length)box.append(e('p','与排名来源的 '+q.rank_comparison_review_months.join('、')+' 个月收益有口径差异待核，不将其静默合并。','warn'));if(q.original_source_bound)box.append(e('p','净值来自聚合源，已校验基金代码、原始文件与计算输入一致；这不代表所有分红和折算均完成官方原文核验。','muted'));return box}
function fundResult(f){const x=e('article',undefined,'result');x.append(e('h3',val(f.name||f.official_name)+' · '+val(f.share_id)));x.append(e('div','净值截至：'+val((f.metrics||{}).last_date||f.nav_date)+'；类别：'+peerText(f.peer_group)+'；策略：'+strategyText(f.strategy),'muted'));x.append(qualityBlock(f),windowTable(f));const fee=f.fee_scenarios||{};if(Object.keys(fee).length){const feeReason={verified_standard_fee_scenario:'已核标准费率情景',evidence_not_verified:'资料未完成核验',fee_evidence_not_verified:'费用原文待核'};const rows=[];for(const n of [1,3,6,12,24]){const w=fee.windows?.[n];if(w){const label=feeReason[w.reason]||(w.status==='estimated'?'标准费率情景':'费用或条款待核');rows.push(n+'月：'+(w.net_scenario_return==null?'费用情景待核':pct(w.net_scenario_return))+'（'+label+'）')}}x.append(e('p','费用情景：'+rows.join('；'),'muted'))}x.append(evidenceBlock(f));return x}
function styleCard(key,s){const card=e('article',undefined,'card');card.append(e('h3',s.label||STYLE_LABELS[key]));const add=(label,items,cls)=>{card.append(e('span',label==='待核研究'?label+' 展示 '+items.length+' 项 / 共 '+(s.research_queue_count??items.length)+' 项':label+' '+items.length+' 项','tag '+cls));items.slice(0,10).forEach(x=>{const r=e('div',undefined,'fund');r.append(e('b',val(x.name)+' · '+val(x.share_id)));r.append(e('small','同类内暂定分数：'+(x.style_score==null?'数据不足':Number(x.style_score).toFixed(1))+'；比较仅限同策略口径。'));r.append(e('small','类别：'+peerText(x.peer_group)));if(x.research_reasons?.length)r.append(e('small','待核：'+x.research_reasons.map(reasonText).join('；'),'warn'));card.append(r)})};add('正式候选',s.candidates||[],'formal');add('待核研究',(s.research_queue||[]),'queue');return card}
async function search(){const raw=document.getElementById('query').value.trim(),out=document.getElementById('results');out.replaceChildren();if(!raw){out.textContent='请输入基金代码或名称。';return}for(const q of raw.split(/[\s,，;；]+/).filter(Boolean)){let matches=/^\d{6}$/.test(q)?(byCode.has(q)?[byCode.get(q)]:[]):(DATA.funds||[]).filter(f=>String(f.name||f.official_name||'').includes(q));if(!matches.length){out.append(e('div','“'+q+'”未在本次快照中匹配到。','result warn'));continue}if(matches.length>1){out.append(e('div','“'+q+'”匹配多个基金，请使用六位代码。','result warn'));continue}try{out.append(fundResult(await loadFund(matches[0])))}catch(error){out.append(e('div','“'+q+'”已在索引中，但详情未能载入。'+assetError(error),'result warn'))}}}
function init(){const meta=DATA.meta||{};document.getElementById('subtitle').textContent='冻结运行 '+val(meta.run_id)+' · 研究截至 '+val(meta.as_of);const stats=document.getElementById('stats');const coverage=meta.coverage||{};for(const [key,label] of [['rank_shares','债券排名覆盖'],['universe_shares','可查询份额'],['history_success','可计算历史'],['document_funds','材料覆盖'],['authored_dossiers','已有研究档案'],['audited_dossiers','独立复核'],['reviewed_dossiers','证据齐备'],['formal_unique_funds','正式候选']]){const v=coverage[key];if(v===undefined||v===null)continue;const a=e('div',undefined,'stat');a.append(e('span',label,'muted'),e('b',String(v)));stats.append(a)}const cq=coverage.data_completeness||{},cn=cq.nav_state_counts||{},cd=cq.document_state_counts||{},cr=cq.research_state_counts||{};document.getElementById('coverage-detail').textContent='数据覆盖：净值已取得并计算 '+(coverage.history_success||0)+' / '+(coverage.universe_shares||0)+' 份额；尚未采集 '+(cn.not_collected||0)+'；抓取失败 '+(cn.acquisition_failed||0)+'；来源或计算校验失败 '+(cn.integrity_or_calculation_failed||0)+'；落后于已知日期 '+(cn.behind_known_observation||0)+'。五期限均可计算 '+(cq.five_windows_calculated??'待统计')+'；三类文件齐备 '+(cd.downloaded||0)+'；尚未完成报告深研 '+(cr.not_researched||0)+'。净值可计算与风险证据齐备分开判断。';const styles=document.getElementById('styles');STYLE_ORDER.forEach(k=>styles.append(styleCard(k,DATA.styles[k]||{})));const ds=document.getElementById('dossiers');const dossierFunds=DATA.funds.filter(f=>f.has_dossier);dossierFunds.slice(0,30).forEach(f=>ds.append(lazyDossier(f)));if(dossierFunds.length>30)ds.append(e('p','默认展示前30份；其余已收录基金请使用上方查询。','muted'));document.getElementById('search').addEventListener('click',search);}

const ASSET_BASE=String(DATA.asset_base||'bond-data').replace(/\/+$/,'');
const assetUrl=path=>ASSET_BASE+'/'+String(path||'').replace(/^\/+/, '');
const FILE_PROTOCOL='file'+':';
const fileServerHint='浏览器不能可靠地从文件直开页面读取分片数据。请在报告目录启动 `python3 -m http.server 8000`，再通过该命令显示的本地 HTTP 地址打开页面。';
function assetError(error){return location.protocol===FILE_PROTOCOL?fileServerHint:'分片数据未能读取：'+String(error&&error.message||error)+'。请确认报告目录与 '+ASSET_BASE+'/manifest.json 一起保留。'}
async function readAsset(path){
 if(location.protocol===FILE_PROTOCOL)throw Error(fileServerHint);
 const response=await fetch(assetUrl(path),{cache:'no-store'});
 if(!response.ok)throw Error(path+' 返回 HTTP '+response.status);
 return response.json();
}
async function loadFund(summary){
 if(summary&&summary.__detail_loaded)return summary;
 if(!summary||!summary.detail_path)throw Error('该基金没有可读取的详情分片');
 const detail=await readAsset(summary.detail_path);
 if(String(detail.share_id)!==String(summary.share_id))throw Error('基金详情分片的代码不匹配');
 Object.assign(summary,detail,{__detail_loaded:true});byCode.set(String(summary.share_id),summary);return summary;
}
function lazyDossier(f){
 const d=e('details'),summary=e('summary',val(f.name||f.official_name)+' · '+val(f.share_id)+' · '+(STATUS[f.dossier_status||f.evidence?.status]||'待核'));d.append(summary);
 let loaded=false,loading=false;
 d.addEventListener('toggle',async()=>{if(!d.open||loaded||loading)return;loading=true;const message=e('p','正在读取基金详情…','muted');d.append(message);try{await loadFund(f);message.remove();d.append(fundResult(f));loaded=true}catch(error){message.textContent=assetError(error)}finally{loading=false}});return d;
}
async function preloadHoldingPreview(){
 const codes=['018603','005975'];
 await Promise.all(codes.map(code=>byCode.has(code)?loadFund(byCode.get(code)).catch(()=>null):null));
}
function setupMixedLoader(){
 const anchor=document.getElementById('styles');if(!anchor)return;
 const section=e('section',undefined,'searchbox');section.id='mixed-loader';
 const button=e('button','加载偏债混合独立比较');button.type='button';
 section.append(e('h2','偏债混合 · 单独比较'),e('p','完整比较表按需读取，不影响基金代码查询与原有四风格历史参考。','muted'),button);
 button.addEventListener('click',async()=>{button.disabled=true;try{DATA.mixed_comparison=await readAsset((DATA.asset_manifest||{}).mixed_path||'mixed.json');section.remove();renderMixed()}catch(error){button.disabled=false;section.append(e('p',assetError(error),'warn'))}});
 anchor.after(section);
}
async function bootstrap(){
 const subtitle=document.getElementById('subtitle');
 if(location.protocol===FILE_PROTOCOL){if(subtitle)subtitle.textContent=fileServerHint;return;}
 try{
  const index=await readAsset('index.json');Object.assign(DATA,index);DATA.funds=Array.isArray(index.funds)?index.funds:[];
  DATA.funds.forEach(f=>byCode.set(String(f.share_id||f.code||''),f));
  init();await preloadHoldingPreview();
  document.getElementById('mixed-comparison')?.remove();document.getElementById('holding-assessment')?.remove();
  if(typeof initHoldingAssessment==='function')initHoldingAssessment();setupMixedLoader();
 }catch(error){if(subtitle)subtitle.textContent=assetError(error);const out=document.getElementById('results');if(out)out.textContent=assetError(error);}

const HOLDING_LABELS={current_fee_version_missing:'当前费用版本待核',holding_scenario_missing:'持有费用情景待核',fee_scenario_not_ready:'费用或退出条件待核',current_fee_version_not_validated:'费用原文尚未独立核验',fee_schedule_as_of_missing:'费率资料日期待核',market_data_end_missing:'净值窗口截止日待核',fee_schedule_after_market_data:'费率资料晚于净值窗口，不能称为当时实时费率',fee_schedule_not_effective_for_market_data:'费率版本与净值窗口日期不匹配',personalized_channel_unknown:'购买渠道未提供',personalized_amount_unknown:'购买金额未提供',redemption_calendar_unknown:'开放赎回日历待核',redemption_date_not_open:'情景日期不在已核开放日中',official_mother_mapping_unavailable:'产品与份额归属待核',evidence_status_not_verified:'当前资料尚未核齐',independent_review_not_passed:'当前版本独立检查未通过',identity_verified_required:'身份待核',report_verified_required:'报告待核',terms_verified_required:'申赎条款待核',risk_verified_required:'风险资料待核',current_risk_report_period_missing:'风险观察日期待核',current_risk_evidence_missing:'风险资料待补',history_metrics_not_available:'历史数据待补',history_stale:'净值时效待核',insufficient_official_mother_products_for_percentile:'可比产品不足，不给精确名次'};

 for(const n of ['1','3','6','12']){const w=f.metrics?.windows?.[n]||{},s=h.windows?.[n]||{},personal=s.personalized_fee_scenario||{},tr=e('tr');
  const reason=[...new Set((s.gate_reasons||[]).map(holdingReason))].join('、');
  [n+'个月',pct(w.return),pct(w.drawdown?.max_drawdown_magnitude),s.ready?pct(s.net_return):(reason||'待核'),personal.status==='estimated'?pct(personal.net_return):'渠道、金额或条款未核'].forEach(t=>tr.append(e('td',t)));table.append(tr);

 }

  const grouped=summary.research_priority_refs||[];
  const suggested=Array.isArray(grouped)?grouped.filter(g=>Number(g.months)===n&&g.priority_eligible!==false&&(g.comparison_share_count===undefined||Number(g.comparison_share_count)>=10)).flatMap(g=>g.refs||[]):[];
  const requested=['018603','005975'].filter(c=>byCode.has(c)).map(c=>({share_id:c,product_key:c}));
  const preferred=[...requested,...suggested,...(summary.research_queue_refs||[]).filter(r=>!r.research_horizons_months||(r.research_horizons_months||[]).includes(n))];
  const refs=formal.length?formal:preferred,seen=new Set(),selected=[];
  for(const ref of refs){const displayShare=String(ref.period_share_ids?.[String(n)]||ref.share_id),f=byCode.get(displayShare),product=ref.product_key||displayShare;if(!f||seen.has(product))continue;seen.add(product);selected.push({ref,f,displayShare});if(selected.length>=10)break;}
  const loaded=await Promise.all(selected.map(async item=>{try{return await loadFund(item.f)}catch(error){return {error}}}));if(sequence!==drawSequence)return;
  list.replaceChildren();if(!formal.length)list.append(e('p','该期限暂没有通过新版全部核验的正式候选。下面是优先研究对象，不能当作买入名单。','warn'));
  for(let index=0;index<selected.length;index++){const {f}=selected[index],value=loaded[index];if(value?.error){list.append(e('p',val(f.name||f.official_name)+' · '+val(f.share_id)+'：详情未能载入，暂不展示收益或回撤。'+assetError(value.error),'warn'));continue;}
   const row=e('div',undefined,'fund'),btn=e('button',val(f.name||f.official_name)+' · '+val(f.share_id));btn.type='button';btn.addEventListener('click',()=>{document.getElementById('query').value=f.share_id;search();document.getElementById('results').scrollIntoView({behavior:'smooth',block:'start'})});
   row.append(btn);const w=f.metrics?.windows?.[String(n)]||{};row.append(e('small',n+'月历史收益 '+pct(w.return)+' · 同窗回撤 '+pct(w.drawdown?.max_drawdown_magnitude)+' · 净值日 '+val(f.metrics?.last_date)));list.append(row);
  }
  if(!selected.length)list.append(e('p','研究对象仍在补资料，可通过下方代码查询查看缺口。','muted'));
